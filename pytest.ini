[pytest]
testpaths = tests
pythonpath = . tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers -m "not live and not slow"
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end API tests
    live: Tests executing live HTTP queries to real external news providers (Yahoo Finance, Google News)
    slow: Tests running local deep neural network inference on real weights (ProsusAI/finbert)
    allow_blocked_network: Test deliberately triggers the offline network guard (blocked attempts do not fail it)
