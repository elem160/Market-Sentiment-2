[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "E501",     # Line length violations (handled progressively)
    "E741",     # Ambiguous variable name (e.g. l)
    "B008",     # Do not perform function call in argument defaults (FastAPI Depends)
    "UP017",    # datetime.UTC requires Python 3.12+ (runtime target is Python 3.11)
    "UP042",    # str, Enum inheritance for Pydantic v2 JSON serialization
    "ASYNC109", # Async function with timeout parameter
    "ASYNC230", # Async file I/O operations
    "ASYNC251", # Async sleep or similar in tests/background workers
]
